services:
  - type: web
    name: crmgmt-v01
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SUPABASE_DB_URL
        sync: false # Set via Render Dashboard (postgres://postgres:[PASSWORD]@db.[REF].supabase.co:5432/postgres)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_MASTER_KEY
        generateValue: true
