<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="520" height="90">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3c68"/>
      <stop offset="100%" stop-color="#051d38"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Circular Crest Seal -->
  <g transform="translate(42, 45)">
    <!-- Outer Gear ring -->
    <circle cx="0" cy="0" r="38" fill="url(#crestGrad)" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2,2"/>
    
    <!-- Cogwheel teeth -->
    <g fill="#f59e0b">
      <rect x="-3" y="-40" width="6" height="5" rx="1"/>
      <rect x="-3" y="35" width="6" height="5" rx="1"/>
      <rect x="-40" y="-3" width="5" height="6" rx="1"/>
      <rect x="35" y="-3" width="5" height="6" rx="1"/>
      <rect x="-28" y="-28" width="6" height="5" rx="1" transform="rotate(45)"/>
      <rect x="23" y="23" width="6" height="5" rx="1" transform="rotate(45)"/>
      <rect x="-28" y="23" width="6" height="5" rx="1" transform="rotate(-45)"/>
      <rect x="23" y="-28" width="6" height="5" rx="1" transform="rotate(-45)"/>
    </g>

    <!-- Inner Emblem: Book and Sun -->
    <circle cx="0" cy="-6" r="11" fill="url(#goldGrad)"/>
    <!-- Sun rays -->
    <path d="M0,-21 L0,-17 M-11,-6 L-15,-6 M11,-6 L15,-6 M-8,-14 L-11,-17 M8,-14 L11,-17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Open Book -->
    <path d="M-14,14 C-7,10 0,14 0,14 C0,14 7,10 14,14 L14,4 C7,1 0,5 0,5 C0,5 -7,1 -14,4 Z" fill="#ffffff"/>
    <path d="M0,5 L0,14" stroke="#0b3c68" stroke-width="1.5"/>
    <!-- Laurel Leaves -->
    <path d="M-22,18 C-24,8 -20,-8 -12,-18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M22,18 C24,8 20,-8 12,-18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography matching exact Reference Image 2 -->
  <text x="96" y="38" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="900" fill="#0d3b66" letter-spacing="1.5">SAVEETHA</text>
  <text x="97" y="56" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="9.8" font-weight="700" fill="#0d3b66" letter-spacing="0.4">INSTITUTE OF MEDICAL AND TECHNICAL SCIENCES</text>
  <text x="97" y="70" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="600" fill="#5c7184" letter-spacing="0.2">(Declared as Deemed to be University under Section 3 of UGC Act 1956)</text>
</svg>
